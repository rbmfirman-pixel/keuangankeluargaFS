<script>
// --- KONFIGURASI CACHE ---
const CACHE_KEY = 'familyWealth_Data';
const CACHE_TTL = 5 * 60 * 1000; // Cache kedaluwarsa dalam 5 Menit (bisa disesuaikan)

/**
 * Fungsi utama untuk mengambil data dengan Lazy Loading dan Caching
 * @param {string} startDate - Format YYYY-MM-DD
 * @param {string} endDate - Format YYYY-MM-DD
 * @param {boolean} forceRefresh - Set 'true' jika dipanggil setelah simpan/hapus transaksi
 */
async function loadDataApps(startDate, endDate, forceRefresh = false) {
  const cacheID = `${CACHE_KEY}_${startDate}_${endDate}`;
  
  // 4. Cek Cache Lokal (Optimalisasi Caching)
  if (!forceRefresh) {
    const cachedData = localStorage.getItem(cacheID);
    if (cachedData) {
      const parsedCache = JSON.parse(cachedData);
      const now = new Date().getTime();
      
      // Jika cache belum kedaluwarsa, gunakan data dari cache
      if (now - parsedCache.timestamp < CACHE_TTL) {
        console.log("Memuat data dari Local Cache (Super Cepat) ⚡");
        renderDataToUI(parsedCache.data);
        return; // Hentikan eksekusi, tidak perlu panggil server
      }
    }
  }

  // Tampilkan indikator loading di UI Anda di sini
  // document.getElementById('loadingSpinner').classList.remove('hidden');

  try {
    const payload = {
      action: 'getData',
      startDate: startDate,  // 1. Lazy Loading / Filter Periode
      endDate: endDate
    };

    const response = await fetch(URL_GOOGLE_SCRIPT_ANDA, { // Ganti dengan variabel URL GAS Anda
      method: 'POST',
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.status === 'success') {
      // Simpan hasil respons ke localStorage beserta timestamp
      localStorage.setItem(cacheID, JSON.stringify({
        timestamp: new Date().getTime(),
        data: result.data
      }));

      console.log("Memuat data baru dari Server GAS ☁️");
      renderDataToUI(result.data);
    } else {
      alert("Gagal memuat data: " + result.message);
    }
  } catch (error) {
    console.error("Error fetching data:", error);
  } finally {
    // Sembunyikan indikator loading di sini
    // document.getElementById('loadingSpinner').classList.add('hidden');
  }
}

/**
 * Fungsi pembantu untuk membersihkan cache 
 * Wajib dipanggil setelah fungsi saveTransaction() atau deleteTransaction() berhasil!
 */
function clearDataCache() {
  // Hapus semua cache yang berkaitan dengan awalan CACHE_KEY
  Object.keys(localStorage).forEach(key => {
    if (key.startsWith(CACHE_KEY)) {
      localStorage.removeItem(key);
    }
  });
  console.log("Cache dibersihkan. Data terbaru akan diambil dari server pada muatan berikutnya.");
}

// --- CONTOH PEMANGGILAN SAAT APLIKASI PERTAMA DIBUKA ---
// Secara default, ambil data bulan ini saja
function initApp() {
  const date = new Date();
  const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).toISOString().split('T')[0];
